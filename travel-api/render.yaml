services:
  - type: web
    name: descubraobrasil-travel-api
    runtime: python
    rootDir: travel-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://www.descubraobrasil.com,https://descubraobrasil.com
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
